<!DOCTYPE html>
<html lang="su">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAKON: Jajampangan Cahaya Salakanagara</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efd8;--ink:#23301f;--card:#fffdf0;--line:#c9c28f;--gold:#e0a912;--leaf:#2e7d4f;--bad:#b3402a;--hud:#23412f;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10211a;--ink:#f1ecd0;--card:#1d3328;--line:#40604c;--gold:#f6c445;--leaf:#8bc34a;--bad:#ff8a6b;--hud:#0a1712}}
:root[data-theme="dark"]{--bg:#10211a;--ink:#f1ecd0;--card:#1d3328;--line:#40604c;--gold:#f6c445;--leaf:#8bc34a;--bad:#ff8a6b;--hud:#0a1712}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',sans-serif;font-size:17px}
#app{max-width:900px;margin:0 auto;padding:10px}
#hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--hud);color:#f1ecd0;padding:6px 14px;border-radius:12px 12px 0 0;font-weight:700}
#hud .sp{flex:1}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#f6c445;box-shadow:0 0 8px #f6c445;margin-right:3px}
.dot.off{background:#52604f;box-shadow:none}
#stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#bfe8a8;border-radius:0 0 12px 12px;touch-action:none}
#ctl{display:flex;justify-content:space-between;margin-top:10px;gap:10px}
#ctl div{display:flex;gap:10px}
.cb{width:76px;height:60px;font-size:26px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit;touch-action:none;user-select:none}
.cb:active{background:var(--gold)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,23,18,.82);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));overflow:auto}
.cb,.btn{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#mt{padding:2px 12px;margin:0;font-size:.9rem}
.card{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:18px 22px;max-width:640px;width:100%;max-height:100%;overflow:auto;margin:auto}
h1{font-size:2rem;line-height:1.1;margin:0 0 6px}
h2{font-size:1.25rem;margin:0 0 8px}
p{margin:.4em 0;line-height:1.45}
.btn{font-family:inherit;font-size:1rem;font-weight:700;border:0;border-radius:10px;padding:8px 18px;background:var(--leaf);color:#fff;cursor:pointer;margin:6px 8px 0 0}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:1rem;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:10px;padding:7px 12px;margin:6px 0;cursor:pointer}
.opt.sel{border-color:var(--gold);background:rgba(246,196,69,.25)}
.opt.ok{border-color:var(--leaf);background:rgba(46,125,79,.25)}
.opt.no{border-color:var(--bad);background:rgba(179,64,42,.2)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row span{flex:1;min-width:180px}
select,input[type=text],textarea{font-family:inherit;font-size:1rem;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:5px 8px}
input[type=text]{width:100%}
textarea{width:100%;height:240px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-weight:700}
.fb.ok{background:rgba(46,125,79,.22)}.fb.no{background:rgba(179,64,42,.2)}
.boss{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.boss i{display:block;height:100%;background:#7c5cc4;transition:width .4s}
.small{font-size:.85rem;opacity:.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#splash{max-width:900px;margin:0 auto;padding:10px;position:relative}
#splash img{display:block;width:100%;height:auto;border-radius:16px;border:2px solid var(--line)}
#splash .sb{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-size:1.15rem;padding:10px 28px;box-shadow:0 4px 18px rgba(0,0,0,.45);animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{transform:translateX(-50%) scale(1.06)}}

</style>
</head>

 $('sv').onclick=()=>{try{const a=JSON.parse($('ta').value);if(!Array.isArray(a)||a.length!=5||a.some(x=>!Array.isArray(x)||!x.length))throw 'Kudu aya 5 daptar soal, teu kosong.';a.flat().forEach(q=>{if(!['mcq','multi','order','classify','fill'].includes(q.t)||!q.q)throw 'Soal teu valid: '+JSON.stringify(q).slice(0,60)});a.forEach((qs,i)=>S[i].qs=qs);try{localStorage.setItem('lakon_q',JSON.stringify(a))}catch(e){}$('em').textContent='Kasimpen.'}catch(e){$('em').textContent='Gagal: '+e}};
 $('rs').onclick=()=>{try{localStorage.removeItem('lakon_q')}catch(e){}DEF.forEach((d,i)=>S[i].qs=JSON.parse(JSON.stringify(d.qs)));$('ta').value=JSON.stringify(S.map(s=>s.qs),null,1);$('em').textContent='Dibalikkeun.'};
 $('bk').onclick=title}

// quiz
let Q={};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(){duck(1);const s=S[G.i];Q={n:0,ok:0,s};G.run=false;nextQ()}
function nextQ(){const s=Q.s,q=s.qs[Q.n];Q.sel=[];Q.done=false;Q.q=q;
 let h='';if(s.boss)h+='<div class="boss"><i style="width:'+(100-100*Q.ok/s.qs.length)+'%"></i></div>';
 h+='<p class="small">Gerbang Pangaweruh '+(Q.n+1)+'/'+s.qs.length+'</p><h2>'+q.q+'</h2><div id="qb"></div><div id="qf"></div><button class="btn" id="qc">Parios</button>';
 say(h);const b=$('qb');
 if(q.t=='mcq'||q.t=='multi')b.innerHTML=q.o.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('');
 if(q.t=='order'){Q.sh=shuf(q.o);draw()}
 if(q.t=='classify')b.innerHTML=q.items.map((it,i)=>'<div class="row"><span>'+it[0]+'</span><select data-i="'+i+'"><option value="-1">Pilih…</option>'+q.cats.map((c,j)=>'<option value="'+j+'">'+c+'</option>').join('')+'</select></div>').join('');
 if(q.t=='fill')b.innerHTML='<input type="text" id="fi" autocomplete="off">';
 b.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(Q.done)return;const i=+el.dataset.i;if(q.t=='mcq')Q.sel=[i];else Q.sel=Q.sel.includes(i)?Q.sel.filter(x=>x!=i):[...Q.sel,i];b.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',Q.sel.includes(+o.dataset.i)))});
 $('qc').onclick=Q.done?advance:check;
 function draw(){b.innerHTML='<p class="small">Pencét kartu dumasar urutan anu bener.</p>'+Q.sh.map((o,i)=>{const k=Q.sel.indexOf(i);return'<button class="opt'+(k>=0?' sel':'')+'" data-i="'+i+'">'+(k>=0?(k+1)+'. ':'')+o+'</button>'}).join('')+'<button class="btn alt" id="ur">Ulang</button>';
  b.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(Q.done)return;const i=+el.dataset.i;if(!Q.sel.includes(i)){Q.sel.push(i);draw()}});$('ur').onclick=()=>{Q.sel=[];draw()}}}
function check(){const q=Q.q;let ok=false;
 if(q.t=='mcq')ok=Q.sel[0]===q.a;
 if(q.t=='multi')ok=Q.sel.length==q.a.length&&q.a.every(x=>Q.sel.includes(x));
 if(q.t=='order')ok=Q.sel.length==q.o.length&&Q.sel.every((x,k)=>Q.sh[x]===q.o[k]);
 if(q.t=='classify'){const ss=[...document.querySelectorAll('#qb select')];ok=ss.every(s=>+s.value===q.items[+s.dataset.i][1]);ss.forEach(s=>{s.disabled=true;s.style.borderColor=+s.value===q.items[+s.dataset.i][1]?'var(--leaf)':'var(--bad)'})}
 if(q.t=='fill'){const v=$('fi').value.toLowerCase().trim();ok=!!v&&q.k.some(k=>v.includes(k));$('fi').disabled=true}
 document.querySelectorAll('#qb .opt').forEach(o=>{o.disabled=true;const i=+o.dataset.i;if(q.t=='mcq'||q.t=='multi'){const c=q.t=='mcq'?i===q.a:q.a.includes(i);o.classList.toggle('ok',c);o.classList.toggle('no',!c&&Q.sel.includes(i))}});
 Q.done=true;sfx(ok?'ok':'no');if(ok)Q.ok++;else{G.lives--;if(G.lives<=0)G.lives=5}dots();
 $('qf').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Leres! Cahaya Si Cahya beuki caang.':'Acan pas. Cahaya Si Cahya ngaredup.')+'</div><p>'+(q.e||'')+'</p>';
 $('qc').textContent=Q.n+1<Q.s.qs.length?'Lanjut':'Tuntung';$('qc').onclick=advance}
function advance(){Q.n++;if(Q.n<Q.s.qs.length)return nextQ();
 const r=Q.ok/Q.s.qs.length,pass=r>=.6,stars=r>=1?3:r>=.66?2:1;
 if(!pass)return say('<h2>Cahaya acan nyala</h2><p>Bener '+Q.ok+' tina '+Q.s.qs.length+'. Maca deui pangjelasan, tuluy cobaan deui.</p><button class="btn" id="go">Cobaan deui</button>'),$('go').onclick=quiz;
 G.sh++;dots();sfx('win');const last=G.i==4;
 say('<h2>'+(last?'Lontar Cahaya nyala deui!':'Pecahan Cahaya '+G.sh+' kapanggih!')+'</h2><p style="font-size:1.8rem;margin:.2em 0">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</p><p>Bener '+Q.ok+' tina '+Q.s.qs.length+'. Kembang kasimpen: '+G.fl+'.</p>'+(last?'<p>Sang Poék Lali ngiles jadi kabut lembut. Lembur Salaka caang deui, jeung tradisi buhun diwariskeun ka generasi salajengna.</p><button class="btn" id="go">Main deui</button>':'<button class="btn" id="go">Stage salajengna</button>'));
 $('go').onclick=last?title:()=>intro(G.i+1)}

// input
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{if(km[e.key]&&G.run){K[km[e.key]]=1;if(km[e.key]=='j')K.jp=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(km[e.key])K[km[e.key]]=0});
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;if(k=='j')K.jp=1});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>K[k]=0))});

// loop
function update(){const p=G.p;p.vx=(K.r-K.l)*4.2;if(K.jp){K.jp=0;const max=G.i>=1?2:1;if(p.jc<max){p.vy=-11.5;p.jc++;sfx('jump')}}
 p.vy+=.6;const px=p.y;p.x=Math.max(0,Math.min(LEN-30,p.x+p.vx));p.y+=p.vy;let land=null;
 if(p.y+40>=GY){land=GY}
 if(p.vy>=0)G.pl.forEach(o=>{if(p.x+24>o.x&&p.x<o.x+o.w&&px+40<=o.y+4&&p.y+40>=o.y)land=o.y});
 if(land!==null){p.y=land-40;p.vy=0;p.jc=0}
 if(p.vx)p.fc=p.vx>0?1:-1;
 G.fw.forEach(f=>{if(!f.t&&Math.abs(f.x-p.x-12)<24&&Math.abs(f.y-p.y-20)<34){f.t=1;G.fl++;dots();sfx('flower')}});
 const gx=LEN-120;if(!G.gate&&p.x+24>gx&&p.x<gx+60){G.gate=true;p.x=gx-40;K.l=K.r=K.j=0;sfx('gate');quiz()}
 G.cam+=(Math.max(0,Math.min(LEN-800,p.x-300))-G.cam)*.12}
function bg(s){const g=cx.createLinearGradient(0,0,0,400);g.addColorStop(0,s.sky[0]);g.addColorStop(1,s.sky[1]);cx.fillStyle=g;cx.fillRect(0,0,800,400);
 if(s.deco=='boss'){cx.fillStyle='rgba(246,196,69,.85)';cx.beginPath();cx.arc(620,110,46,0,7);cx.fill()}
 [[.2,s.hill[0],150],[.45,s.hill[1],100]].forEach(([par,col,h],li)=>{cx.fillStyle=col;cx.beginPath();cx.moveTo(0,400);for(let x=0;x<=800;x+=20){const wx=x+G.cam*par;cx.lineTo(x,GY-h+Math.sin(wx/(90+li*40))*40+Math.sin(wx/37)*8)}cx.lineTo(800,400);cx.fill()});
 const c=G.cam*.7;
 if(s.deco=='bamboo'){cx.fillStyle='rgba(60,120,50,.55)';for(let i=0;i<14;i++){const x=((i*131-c)%1100+1100)%1100-100;cx.fillRect(x,40+(i%3)*30,9,300);cx.fillStyle='rgba(140,200,90,.7)';cx.fillRect(x-6,120+(i%4)*40,21,4);cx.fillStyle='rgba(60,120,50,.55)'}}
 if(s.deco=='trees'||s.deco=='temple'){for(let i=0;i<9;i++){const x=((i*170-c)%1300+1300)%1300-100;if(s.deco=='trees'){cx.fillStyle='rgba(20,50,35,.65)';cx.fillRect(x,200,14,150);cx.beginPath();cx.arc(x+7,190,48,0,7);cx.fill()}else{cx.fillStyle='rgba(30,60,45,.7)';cx.fillRect(x,230,60,120);cx.fillRect(x+8,200,44,30);cx.fillRect(x+18,176,24,24)}}
  cx.fillStyle='#f6e27a';for(let i=0;i<14;i++){cx.globalAlpha=.4+.4*Math.sin(T/20+i);cx.fillRect(((i*97-c*1.3)%800+800)%800,60+(i*53)%240+Math.sin(T/30+i)*10,3,3)}cx.globalAlpha=1}
 if(s.deco=='falls'){cx.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<5;i++){const x=((i*190+60-c)%1000+1000)%1000-100;cx.fillRect(x,0,26,GY);for(let k=0;k<4;k++)cx.fillRect(x+4+k*5,((T*3+k*70+i*40)%GY),3,40)}}
 if(s.deco=='boss'){cx.fillStyle='rgba(30,10,60,.55)';for(let i=0;i<6;i++){cx.beginPath();cx.arc(80+i*140+Math.sin(T/40+i)*20-c*.1,70+Math.sin(T/30+i*2)*14,54,0,7);cx.fill()}}}
function draw(){const s=S[G.i];bg(s);cx.save();cx.translate(-G.cam,0);
 cx.fillStyle='#6b4a2e';cx.fillRect(0,GY,LEN+200,80);cx.fillStyle=s.hill[1];cx.fillRect(0,GY,LEN+200,8);
 G.pl.forEach(o=>{cx.fillStyle='#8b5e3c';cx.fillRect(o.x,o.y,o.w,12);cx.fillStyle='#b98a52';cx.fillRect(o.x,o.y,o.w,4)});
 G.fw.forEach(f=>{if(f.t)return;const b=Math.sin(T/10+f.x)*3;cx.fillStyle='#f6c445';cx.shadowColor='#f6c445';cx.shadowBlur=10;for(let a=0;a<5;a++){cx.beginPath();cx.arc(f.x+Math.cos(a*1.256)*6,f.y+b+Math.sin(a*1.256)*6,4,0,7);cx.fill()}cx.fillStyle='#fff7c2';cx.beginPath();cx.arc(f.x,f.y+b,3,0,7);cx.fill();cx.shadowBlur=0});
 const gx=LEN-120;cx.fillStyle='#5a5f66';cx.fillRect(gx-8,GY-150,76,150);cx.fillStyle='#464a50';cx.fillRect(gx+10,GY-120,40,120);cx.fillStyle='#f6c445';cx.shadowColor='#f6c445';cx.shadowBlur=14+Math.sin(T/12)*6;cx.beginPath();cx.arc(gx+30,GY-138,10,0,7);cx.fill();cx.shadowBlur=0;
 if(s.boss){cx.fillStyle='rgba(30,10,60,.8)';cx.beginPath();cx.arc(gx-30,GY-190+Math.sin(T/25)*10,60,0,7);cx.fill();cx.fillStyle='#f6c445';cx.fillRect(gx-52,GY-198+Math.sin(T/25)*10,12,6);cx.fillRect(gx-26,GY-198+Math.sin(T/25)*10,12,6)}
 const p=G.p,f=p.fc;cx.save();cx.translate(p.x+12,p.y);cx.scale(f,1);
 cx.fillStyle='#1d1d26';cx.fillRect(-9,22,8,18);cx.fillRect(1,22,8,18);cx.fillStyle='#f6c445';cx.fillRect(-11,10,22,14);cx.fillStyle='#3a2a1a';cx.fillRect(-9,36,8,4);cx.fillRect(1,36,10,4);
 cx.fillStyle='#e0ae83';cx.beginPath();cx.arc(0,5,9,0,7);cx.fill();cx.fillStyle='#2d4a8a';cx.fillRect(-10,-4,20,6);cx.fillStyle='#f6c445';cx.fillRect(-4,-3,3,4);cx.fillRect(3,-3,3,4);cx.fillStyle='#222';cx.fillRect(3,5,2,2);cx.restore();
 const cxp=p.x+(f>0?-18:42)+Math.sin(T/20)*4,cyp=p.y-12+Math.sin(T/12)*6;cx.fillStyle='#2b2118';cx.shadowColor='#f6c445';cx.shadowBlur=14;cx.beginPath();cx.arc(cxp,cyp,9,0,7);cx.fill();cx.fillStyle='#f6c445';cx.fillRect(cxp-3,cyp-6,6,3);cx.beginPath();cx.arc(cxp-f*11,cyp+4,3,0,7);cx.fill();cx.shadowBlur=0;cx.restore()}
function loop(){T++;if(G.run){update();draw()}else if(G.p)draw();else{bg(S[0]);}requestAnimationFrame(loop)}

// ===== audio (WebAudio, tanpa berkas luar) =====
const A={c:null,on:true,t:0,step:0,st:0,tm:null};
try{if(localStorage.getItem('lakon_m')==='0')A.on=false}catch(e){}
const sal=k=>293.66*Math.pow(2,k*.2);
function aInit(){if(A.c)return;try{const C=window.AudioContext||window.webkitAudioContext;A.c=new C();const c=A.c;A.m=c.createGain();A.m.gain.value=A.on?.8:0;A.m.connect(c.destination);A.mu=c.createGain();A.mu.gain.value=.5;A.mu.connect(A.m);A.sf=c.createGain();A.sf.gain.value=.9;A.sf.connect(A.m);
 const b=c.createBuffer(1,c.sampleRate>>1,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.nb=b;
 A.t=c.currentTime+.1;A.step=0;A.tm=setInterval(sched,30)}catch(e){A.c=null}}
function tone(f,t,d,ty,v,dest,sl,vib){const c=A.c,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);
 if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d+.1)}
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(vib?.08:.008));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||A.sf);o.start(t);o.stop(t+d+.1)}
function noise(t,d,v,fq,dest){const c=A.c,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=A.nb;f.type='bandpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||A.mu);s.start(t);s.stop(t+d+.05)}
// pola melodi (indeks salendro) dibuat tetap per stage
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAT=[0,1,2,3,4].map(i=>{const r=rng(77+i*13),p=[];let k=2+i%3;for(let b=0;b<4;b++)for(let s=0;s<16;s++){if(b==3&&s>=8&&b>0&&0){}
 const on=s%2==0||r()<.25;if(on){k+=Math.round((r()-.5)*3);k=Math.max(0,Math.min(9,k));p.push(b==3&&s==15?0:k)}else p.push(-1)}return p});
function sched(){const c=A.c;if(!c||c.state!='running')return;const bpm=[84,92,98,88,112][A.st],dur=60/bpm/2;
 while(A.t<c.currentTime+.15){const t=A.t,s=A.step%64,sb=s%16;
  if(A.on){const n=PAT[A.st][s];
   if(n>=0){tone(sal(n),t,.5,'triangle',.16,A.mu);tone(sal(n)*2,t,.2,'sine',.05,A.mu)}
   if(sb==0)tone(sal(0)/2,t,dur*14,'sine',.12,A.mu);
   if(sb%8==0&&s%32<24){const m=PAT[A.st][s+2]>=0?PAT[A.st][s+2]:3;tone(sal(m+5>9?m:m+5)*1,t,dur*5,'sine',.1,A.mu,0,1)}
   if(sb%4==0)tone(130,t,.18,'sine',.5,A.mu,48);
   if(sb%8==4||(A.st==4&&sb%4==2))noise(t,.07,.22,2200);
   if(sb%2==1)noise(t,.03,.07,6500)}
  A.t+=dur;A.step++}}
function sfx(k){const c=A.c;if(!c||!A.on||c.state!='running')return;const t=c.currentTime;
 if(k=='jump')tone(330,t,.16,'square',.07,A.sf,740);
 if(k=='flower'){tone(sal(7),t,.18,'triangle',.18);tone(sal(9)*1.5,t+.07,.3,'triangle',.18)}
 if(k=='gate'){[0,2,4,6,8].forEach((n,i)=>tone(sal(n),t+i*.09,.5,'triangle',.2));noise(t,.5,.15,900,A.sf)}
 if(k=='ok'){[4,6,9].forEach((n,i)=>tone(sal(n)*2,t+i*.09,.35,'triangle',.2));}
 if(k=='no'){tone(200,t,.35,'sawtooth',.12,A.sf,90);tone(150,t+.12,.35,'sawtooth',.1,A.sf,70)}
 if(k=='win'){[0,2,4,5,7,9,10].forEach((n,i)=>{tone(sal(n)*2,t+i*.11,.6,'triangle',.2);tone(sal(n),t+i*.11,.6,'sine',.12)})}
 if(k=='click')tone(520,t,.08,'sine',.12)}
function music(st){A.st=st;A.step=0;if(A.c)A.t=A.c.currentTime+.1}
function duck(on){if(A.c)A.mu.gain.setTargetAtTime(on?.28:.5,A.c.currentTime,.2)}
function setMute(){$('mt').textContent=A.on?'Musik hurung':'Musik pareum';if(A.c)A.m.gain.setTargetAtTime(A.on?.8:0,A.c.currentTime,.05);try{localStorage.setItem('lakon_m',A.on?'1':'0')}catch(e){}}
$('mt').onclick=()=>{aInit();if(A.c&&A.c.state!='running')A.c.resume();A.on=!A.on;setMute();$('mt').blur()};
document.addEventListener('visibilitychange',()=>{if(A.c)document.hidden?A.c.suspend():A.c.resume()});
function startAudio(){aInit();if(A.c&&A.c.state!='running')A.c.resume();setMute()}
const _s=()=>{const e=document.getElementById('splash');if(!e)return;e.remove();$('app').style.display='';document.removeEventListener('keydown',_k);startAudio();sfx('click')};
const _k=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();_s()}};
$('sp').onclick=_s;$('splash').querySelector('img').onclick=_s;document.addEventListener('keydown',_k);
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(A.c&&A.c.state=='suspended'&&!document.hidden)A.c.resume()}));
G.p={x:60,y:GY-40,vx:0,vy:0,jc:0,fc:1};G.pl=[];G.fw=[];G.cam=0;title();loop();
</script>
